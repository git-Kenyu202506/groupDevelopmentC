<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>社員登録情報（入力）</title>
	<link rel="stylesheet" th:href="@{/style0305.css}">
	<script src="/js/form-validator.js"></script>

	<script>
		function validateNumberInput(input) {
			input.value = input.value.replace(/[^0-9]/g, "");
		}
		function validatePassInput(input) {
			input.value = input.value.replace(/[^a-zA-Z0-9]/g, "");
		}

	</script>

	<script th:if="${nameNull != null}">
		alert('[[${nameNull}]]');
	</script>
	<script th:if="${ageNull != null}">
		alert('[[${ageNull}]]');
	</script>
	<script th:if="${passwordUnmatch != null}">
		alert('[[${passwordUnmatch}]]');
	</script>
	<script th:if="${passwordFormError != null}">
		alert('[[${passwordFormError}]]');
	</script>

</head>

<body>

	<header>
		<h1>社員登録情報（入力）</h1>
		<div class="session">
			<p><span th:text="${name} ?: '未ログイン'"></span>さん</p>
			<div class="login_time">
				<p><span th:text="${loginDateTime} ?: '---'"></span></p>
			</div>
		</div>
	</header>

	<main>

		<form action="/employee/insert_check" th:object="${Employee}" method="post">
			<div class="input_line">
				<label>社員名</label> <input type="text" name="name" th:field="*{name}" title="氏名を入力して下さい。" required
					autofocus>
				<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div><br>
			<div class="input_line">
				<label>年齢 </label><input type="text" name="age" th:value="${Employee.age == 0 ? '': Employee.age}"
					oninput="validateNumberInput(this)" title="年齢を入力して下さい。" required>
				<div th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
			</div> <br>
			<div class="input_line">
				<label>パスワード</label> <input type="password" name="password" th:field="*{password}" minlength="8"
					oninput="validatePassInput(this)" title="半角英数字で入力して下さい。" required>
				<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div><br>
			<div class="input_line">
				<label>パスワード確認</label> <input type="password" name="password_check" th:field="*{password_check}"
					minlength="8" oninput="validatePassInput(this)" title="半角英数字で入力して下さい。" required>
				<div th:if="${#fields.hasErrors('password_check')}" th:errors="*{password_check}"></div>
			</div><br>

			<p class="copyright">Copyright &copy; 2025 JavaStudy Team C</p>
			<div class="buttons">
				<input type="submit" value="確認" class="input_button orange_button">
				<a th:href="@{/employee/backMainMenu}" class="input_button_like">戻る</a>
			</div>
		</form>




	</main>

</body>

</html>
