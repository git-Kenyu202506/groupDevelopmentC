<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>社員登録情報（入力）</title>
	<link rel="stylesheet" href="/style0305.css">
	<script>
		function validateNumberInput(input) {
			input.value = input.value.replace(/[^0-9]/g, "");
		}
	</script>
</head>

<body>

	<header>
		<h1>社員登録情報（完了）</h1>
		<div class="session">
				<p>ログイン者名 <span th:text="${name}"></span></p>
				<div class="login_time">
					<p>ログイン日時<span th:text="${loginDatetime}"></span></p>
				</div>
				<!-- <div>
				                     <p><span th:text="${name}">菅原</span>さん</p>
				                 </div>
				         
				                 <div>
				                     <p th:text="${loginDateTime}">2025/08/19 19:00</p>
				</div> -->
			</div>
	</header>

	<main>
		<div class="insert_result">
			<p th:text="社員情報の登録が完了しました。" class="result_msg"></p>

			<p class="copyright">Copyright &copy; 2025 JavaStudy Team C</p>

			<div class="buttons">
				<input type="submit" onclick="location.href='http://localhost:8080/employee/mainMenu'" value="メニュー"
					class="input_button">
				<input type="submit" onclick="location.href='http://localhost:8080/employee/searchEmployee'" value="検索へ" class="input_button orange_button">

</html>
