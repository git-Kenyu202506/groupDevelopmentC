<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>社員情報削除（完了）</title>
	<link rel="stylesheet" href="/style05.css">
</head>

<body>

	<header>
		<h1>社員情報削除（完了）</h1>
		<div class="session">
			<p><span th:text="${name} ?: '未ログイン'"></span>さん</p>
			<div class="login_time">
				<p><span th:text="${loginDateTime} ?: '---'"></span></p>
			</div>
		</div>
	</header>


	<main>
		<div class="container">
			<div class="delete_result">
				<div class="delete_result_contain">
					<p class="result_msg" th:text="${msg}"></p>

					<p class="copyright">Copyright &copy; 2025 JavaStudy Team C</p>

					<div class="buttons">
						<div class="result_button">
							<a th:href="@{/employee/backToMainMenu}" class="input_button_like">メニュー</a>
							<a th:href="@{/employee/seachEmployee}" class="input_button_like orange_button">検索へ</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>



</body>

</html>
