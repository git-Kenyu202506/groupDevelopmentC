<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>社員情報削除（完了）</title>
	<link rel="stylesheet" href="/style0305.css">
</head>

<body>

	<header>
		<h1>社員情報削除（完了）</h1>
		<div class="session">
			<p>ログイン者名 <span th:text="${name}"></span></p>
			<div class="login_time">
				<p>ログイン日時<span th:text="${date}"></span></p>
				<p>ログイン時間<span th:text="${time}"></span></p>
			</div>
		</div>
	</header>

	<main>
		<div class="delete_result">
			<p class="result_msg" th:text="${msg}"></p>

			<p class="copyright">Copyright &copy; 2025 JavaStudy Team C</p>

			<div class="buttons">
				<input type="submit" onclick="location.href='http://localhost:8080/employee/mainMenu'" value="メニュー"
					class="input_button">
				<input type="submit" onclick="location.href='検索画面のリンク'" value="検索へ" class="input_button">
			</div>
		</div>
	</main>



</body>

</html>
